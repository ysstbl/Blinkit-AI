services:
  - type: web
    name: blinkit-ai-api
    runtime: python
    rootDir: backend
    buildCommand: pip install --no-cache-dir -r requirements-runtime.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: HF_EMBEDDING_MODEL
        value: sentence-transformers/all-MiniLM-L6-v2
      - key: ALLOWED_ORIGINS
        value: https://your-frontend-domain.example
      - key: HF_HOME
        value: /tmp/huggingface
      - key: OTEL_ENVIRONMENT
        value: production
      - key: PROMETHEUS_URL
        sync: false

  - type: web
    name: blinkit-ai-ui
    runtime: static
    rootDir: recipe-cart-ui
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://blinkit-ai-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html