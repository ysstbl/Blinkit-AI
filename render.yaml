services:
  - type: web
    name: blinkit-ai-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://your-frontend-domain.example

  - type: web
    name: blinkit-ai-ui
    runtime: static
    rootDir: recipe-cart-ui
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://blinkit-ai-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html